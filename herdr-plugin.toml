id = "blockshiftnetwork.telegram-attention"
name = "Telegram Attention Alerts"
version = "0.3.0"
min_herdr_version = "0.8.0"
description = "Sends multilingual Telegram alerts when a Herdr agent needs attention."
platforms = ["linux", "macos"]

[[actions]]
id = "test"
title = "Send Telegram test alert"
contexts = ["global", "workspace", "tab", "pane"]
command = ["bash", "bin/herdr-telegram-attention", "--test"]

[[actions]]
id = "status"
title = "Show Telegram alert configuration status"
contexts = ["global", "workspace", "tab", "pane"]
command = ["bash", "bin/herdr-telegram-attention", "--status"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "bin/herdr-telegram-attention", "--event"]

[[panes]]
id = "dispatcher"
title = "Telegram attention dispatcher"
placement = "tab"
command = ["bash", "bin/herdr-telegram-attention", "--listen"]
